<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MK Time — Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">
  <div>
    <h1>MK TIME</h1>
    <p>Admin Dashboard</p>
  </div>

  <a class="admin-link" href="index.html">Public Site</a>
</header>


<!-- ================= RESULT SUMMARY CONTROL ================= -->

<section class="section">

  <div class="section-title">
    <span>✏️ EDIT RESULT TABLE</span>
  </div>

  <div class="result-editor">

    <label>DATE</label>

    <input
      id="summaryDate"
      type="number"
      min="1"
      max="31"
      placeholder="Example: 29"
    >

    <div class="summary-input-grid">

      <div>
        <label>SM</label>
        <input id="summarySM" type="text">
      </div>

      <div>
        <label>DB</label>
        <input id="summaryDB" type="text">
      </div>

      <div>
        <label>SG</label>
        <input id="summarySG" type="text">
      </div>

      <div>
        <label>FB</label>
        <input id="summaryFB" type="text">
      </div>

      <div>
        <label>GB</label>
        <input id="summaryGB" type="text">
      </div>

      <div>
        <label>GL</label>
        <input id="summaryGL" type="text">
      </div>

      <div>
        <label>DS</label>
        <input id="summaryDS" type="text">
      </div>

    </div>

    <button
      type="button"
      id="saveSummaryBtn"
      onclick="saveResultSummary()"
    >
      💾 SAVE RESULT TABLE
    </button>

  </div>

</section>


<main>

<!-- ================= LOGIN ================= -->

<section id="loginBox" class="section">

  <div class="section-title">
    <span>ADMIN LOGIN</span>
  </div>

  <form id="loginForm" class="form">

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

    <p id="loginMsg"></p>

  </form>

</section>


<!-- ================= DASHBOARD ================= -->

<section id="dashboard" hidden>

  <section class="notes">

    <h2>Manage Announcements</h2>

    <p>
      Changes are stored in the shared Firebase database
      and appear on the public site for everyone.
    </p>

  </section>


  <!-- ================= ADD / EDIT BOX ================= -->

  <section class="section">

    <div class="section-title">
      <span>ADD / EDIT BOX</span>
    </div>

    <form id="boxForm" class="form">

      <input
        type="hidden"
        id="editId"
      >

      <input
        id="name"
        placeholder="Name / announcement"
        required
      >

      <input
        id="time"
        type="time"
        required
      >

      <input
        id="value"
        placeholder="Result / status text"
        required
      >

      <select id="section">

        <option value="live">
          LIVE
        </option>

        <option value="next">
          NEXT
        </option>

      </select>

      <button
        type="submit"
        id="saveBtn"
      >
        Add Box
      </button>

      <button
        type="button"
        id="cancelBtn"
        class="secondary"
        hidden
      >
        Cancel Edit
      </button>

    </form>

  </section>


  <!-- ================= LIVE BOXES ================= -->

  <section class="section">

    <div class="section-title">
      <span>LIVE BOXES</span>
    </div>

    <div
      id="liveAdmin"
      class="cards"
    ></div>

  </section>


  <!-- ================= NEXT BOXES ================= -->

  <section class="section">

    <div class="section-title">
      <span>NEXT BOXES</span>
    </div>

    <div
      id="nextAdmin"
      class="cards"
    ></div>

  </section>


  <!-- ================= PREVIOUS RECORDS MANAGER ================= -->

  <section class="section">

    <div class="section-title">
      <span>PREVIOUS RECORDS</span>
    </div>

    <form id="recordForm" class="form">

      <input
        type="hidden"
        id="recordEditIndex"
        value=""
      >

      <input
        id="recordMonth"
        type="text"
        placeholder="Month (example: August 2026)"
        required
      >

      <input
        id="recordDate"
        type="date"
        required
      >

      <input
        id="recordStatus"
        type="text"
        placeholder="Status (example: Published)"
        required
      >

      <input
        id="recordValue"
        type="text"
        placeholder="Result / Value"
        required
      >

      <button
        type="submit"
        id="recordSaveBtn"
      >
        Add Record
      </button>

      <button
        type="button"
        id="recordCancelBtn"
        class="secondary"
        hidden
      >
        Cancel Edit
      </button>

    </form>

    <div
      id="adminRecords"
      class="records"
    ></div>

    <p id="recordMsg"></p>

  </section>


  <!-- ================= CHANGE PASSWORD ================= -->

  <section class="section">

    <div class="section-title">
      <span>CHANGE PASSWORD</span>
    </div>

    <form id="pwForm" class="form">

      <input
        id="newPassword"
        type="password"
        minlength="6"
        placeholder="New password (6+ characters)"
        required
      >

      <button type="submit">
        Change Password
      </button>

      <p id="pwMsg"></p>

    </form>

  </section>


  <!-- ================= LOGOUT ================= -->

  <button
    id="logout"
    class="secondary"
  >
    Logout
  </button>

</section>

</main>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  auth,
  db,
  doc,
  getDoc,
  siteRef,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut,
  updatePassword,
  onSnapshot,
  setDoc
} from "./firebase.js";


/* ================= DATA ================= */

let data = {
  live: [],
  next: [],
  records: {}
};


/* ================= ADMIN EMAIL ================= */

const ADMIN_EMAIL =
  "sagartech5892@gmail.com";


/* ================= SHORT FUNCTION ================= */

const $ =
  id => document.getElementById(id);


/* ================= HTML ESCAPE ================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


/* ================= 24 HOUR TIME ================= */

function to24(time){

  const m =
    String(time).match(
      /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
    );

  if(!m) return "";

  let hour =
    Number(m[1]);

  const minute =
    m[2];

  const ampm =
    m[3].toUpperCase();


  if(
    ampm === "PM" &&
    hour < 12
  ){
    hour += 12;
  }


  if(
    ampm === "AM" &&
    hour === 12
  ){
    hour = 0;
  }


  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute
  );

}


/* ================= 12 HOUR TIME ================= */

function to12(time){

  if(!time) return "";

  const parts =
    time.split(":");

  let hour =
    Number(parts[0]);

  const minute =
    parts[1];

  const ampm =
    hour >= 12
      ? "PM"
      : "AM";

  hour =
    hour % 12 || 12;


  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute +
    " " +
    ampm
  );

}


/* ================= RENDER BOXES ================= */

function render(){

  ["live","next"].forEach(
    function(section){

      const container =
        $(section + "Admin");

      const boxes =
        data[section] || [];


      if(!container) return;


      if(boxes.length === 0){

        container.innerHTML =
          '<p class="empty">No boxes.</p>';

        return;

      }


      container.innerHTML =
        boxes.map(
          function(box){

            return `

              <article class="card admin-card">

                <div>

                  <small>
                    ${esc(box.time)}
                  </small>

                  <h3>
                    ${esc(box.name)}
                  </h3>

                  <p>
                    ${esc(box.value)}
                    ${
                      box.locked
                        ? " • LOCKED"
                        : ""
                    }
                  </p>

                </div>

                <div class="actions">

                  <button
                    onclick="editBox('${esc(box.id)}','${section}')"
                  >
                    Edit
                  </button>

                  <button
                    onclick="toggleLock('${esc(box.id)}','${section}')"
                  >
                    ${
                      box.locked
                        ? "Unlock"
                        : "Lock"
                    }
                  </button>

                  <button
                    onclick="deleteBox('${esc(box.id)}','${section}')"
                    class="danger"
                  >
                    Delete
                  </button>

                </div>

              </article>

            `;

          }
        ).join("");

    }
  );

}


/* ================= SAVE SITE DATA ================= */

async function saveData(){

  await setDoc(
    siteRef,
    data
  );

  render();

}


/* ================= EDIT BOX ================= */

window.editBox =
function(id,section){

  const boxes =
    data[section] || [];


  const box =
    boxes.find(
      item =>
        item.id === id
    );


  if(!box) return;


  $("editId").value =
    box.id;

  $("name").value =
    box.name;

  $("time").value =
    to24(box.time);

  $("value").value =
    box.value;

  $("section").value =
    section;

  $("saveBtn").textContent =
    "Save Changes";

  $("cancelBtn").hidden =
    false;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ================= LOCK ================= */

window.toggleLock =
async function(id,section){

  const boxes =
    data[section] || [];


  const box =
    boxes.find(
      item =>
        item.id === id
    );


  if(!box) return;


  box.locked =
    !box.locked;


  await saveData();

};


/* ================= DELETE BOX ================= */

window.deleteBox =
async function(id,section){

  const ok =
    confirm(
      "Delete this box?"
    );


  if(!ok) return;


  data[section] =
    (
      data[section] || []
    )
    .filter(
      box =>
        box.id !== id
    );


  await saveData();

};


/* ================= RESET FORM ================= */

function resetForm(){

  $("editId").value =
    "";

  $("name").value =
    "";

  $("time").value =
    "";

  $("value").value =
    "";

  $("section").value =
    "live";

  $("saveBtn").textContent =
    "Add Box";

  $("cancelBtn").hidden =
    true;

}


/* ================= ADD / EDIT BOX ================= */

$("boxForm").onsubmit =
async function(event){

  event.preventDefault();


  const editId =
    $("editId").value;

  const section =
    $("section").value;


  const box = {

    name:
      $("name").value.trim(),

    time:
      to12(
        $("time").value
      ),

    value:
      $("value").value.trim(),

    locked:false

  };


  /* EDIT */

  if(editId){

    let oldBox =
      null;


    for(
      const sec of
      ["live","next"]
    ){

      const index =
        (
          data[sec] || []
        )
        .findIndex(
          item =>
            item.id === editId
        );


      if(index !== -1){

        oldBox =
          data[sec][index];

        data[sec].splice(
          index,
          1
        );

        break;

      }

    }


    box.id =
      editId;

    box.locked =
      oldBox
        ? !!oldBox.locked
        : false;

  }


  /* ADD */

  else{

    box.id =
      crypto.randomUUID();

  }


  if(
    !Array.isArray(
      data[section]
    )
  ){

    data[section] = [];

  }


  data[section].push(
    box
  );


  try{

    await saveData();

    resetForm();

  }

  catch(error){

    console.error(error);

    alert(
      "Box save nahi hua. Firebase rules check karo."
    );

  }

};


/* ================= CANCEL ================= */

$("cancelBtn").onclick =
function(){

  resetForm();

};


/* =====================================================
   RESULT SUMMARY
   ===================================================== */

/*
   Firebase structure:

   resultSummary
       └── current
             ├── month: "August 2026"
             └── records
                   ├── 29
                   │    ├── SM
                   │    ├── DB
                   │    └── ...
                   ├── 30
                   └── 31
*/


window.saveResultSummary =
async function(){

  const user =
    auth.currentUser;


  if(
    !user ||
    user.email !== ADMIN_EMAIL
  ){

    alert(
      "Sirf Admin Result Table edit kar sakta hai."
    );

    return;

  }


  const date =
    $("summaryDate")
      .value
      .trim();


  if(!date){

    alert(
      "Date daalo."
    );

    return;

  }


  const day =
    Number(date);


  if(
    !Number.isInteger(day) ||
    day < 1 ||
    day > 31
  ){

    alert(
      "Date 1 se 31 ke beech honi chahiye."
    );

    return;

  }


  const now =
    new Date();


  const month =
    now.toLocaleString(
      "en-US",
      {
        month:"long",
        year:"numeric"
      }
    );


  const summary = {

    SM:
      $("summarySM")
        .value
        .trim(),

    DB:
      $("summaryDB")
        .value
        .trim(),

    SG:
      $("summarySG")
        .value
        .trim(),

    FB:
      $("summaryFB")
        .value
        .trim(),

    GB:
      $("summaryGB")
        .value
        .trim(),

    GL:
      $("summaryGL")
        .value
        .trim(),

    DS:
      $("summaryDS")
        .value
        .trim()

  };


  const resultRef =
    doc(
      db,
      "resultSummary",
      "current"
    );


  const btn =
    $("saveSummaryBtn");


  if(btn){

    btn.disabled =
      true;

    btn.textContent =
      "Saving...";

  }


  try{

    const snap =
      await getDoc(
        resultRef
      );


    let oldData =
      snap.exists()
        ? snap.data()
        : {};


    let records =
      oldData.records || {};


    /*
       IMPORTANT:
       Sirf selected date update hogi.
       Baaki dates safe rahengi.
    */

    records[String(day)] =
      summary;


    await setDoc(
      resultRef,
      {

        month:
          month,

        records:
          records,

        updatedAt:
          new Date().toISOString()

      },
      {
        merge:true
      }
    );


    alert(
      "RESULT " +
      day +
      " SAVE HO GAYA ✅"
    );


    /*
       Form clear.
    */

    $("summarySM").value =
      "";

    $("summaryDB").value =
      "";

    $("summarySG").value =
      "";

    $("summaryFB").value =
      "";

    $("summaryGB").value =
      "";

    $("summaryGL").value =
      "";

    $("summaryDS").value =
      "";

  }

  catch(error){

    console.error(
      "Result save error:",
      error
    );


    alert(
      "Result save nahi hua ❌"
    );

  }

  finally{

    if(btn){

      btn.disabled =
        false;

      btn.textContent =
        "💾 SAVE RESULT TABLE";

    }

  }

};


/* ================= LOGIN ================= */

$("loginForm").onsubmit =
async function(event){

  event.preventDefault();


  $("loginMsg").textContent =
    "Logging in...";


  try{

    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );


    $("loginMsg").textContent =
      "";

  }

  catch(error){

    console.error(error);

    $("loginMsg").textContent =
      "Login failed: " +
      error.message;

  }

};


/* ================= LOGOUT ================= */

$("logout").onclick =
async function(){

  await signOut(auth);

};


/* ================= CHANGE PASSWORD ================= */

$("pwForm").onsubmit =
async function(event){

  event.preventDefault();


  const user =
    auth.currentUser;


  if(!user){

    $("pwMsg").textContent =
      "Please login first.";

    return;

  }


  const newPassword =
    $("newPassword").value;


  try{

    await updatePassword(
      user,
      newPassword
    );


    $("pwMsg").textContent =
      "Password changed successfully.";

    $("newPassword").value =
      "";

  }

  catch(error){

    console.error(error);

    $("pwMsg").textContent =
      "Password change failed. Log in again if required.";

  }

};


/* ================= AUTH STATE ================= */

onAuthStateChanged(
  auth,
  function(user){

    $("loginBox").hidden =
      !!user;

    $("dashboard").hidden =
      !user;


    if(user){

      onSnapshot(
        siteRef,

        function(snapshot){

          if(
            snapshot.exists()
          ){

            data = {

              live:[],
              next:[],
              records:{},

              ...snapshot.data()

            };

          }

          else{

            data = {

              live:[],
              next:[],
              records:{}

            };

          }


          render();

        },

        function(error){

          console.error(
            "Firebase error:",
            error
          );

        }
      );

    }

  }
);


/* ================= INITIAL RENDER ================= */

render();

</script>

</body>
  </html>
