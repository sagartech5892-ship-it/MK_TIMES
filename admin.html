<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK Time — Admin</title>
<link rel="stylesheet" href="style.css">

<style>
.result-editor{
  background:#18253d;
  border:1px solid #2d3b55;
  border-radius:16px;
  padding:16px;
  overflow:hidden;
}

.summary-scroll{
  overflow-x:auto;
  width:100%;
}

.summary-editor-table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

.summary-editor-table th,
.summary-editor-table td{
  border:1px solid #2d3b55;
  padding:8px;
  text-align:center;
  white-space:nowrap;
}

.summary-editor-table input{
  width:80px;
  box-sizing:border-box;
  padding:9px 6px;
  border-radius:7px;
  border:1px solid #2d3b55;
  background:#101a30;
  color:white;
  text-align:center;
}

.summary-editor-table th{
  font-weight:800;
}

.column-controls{
  display:flex;
  gap:5px;
  justify-content:center;
  margin-bottom:5px;
}

.column-controls button{
  padding:4px 7px;
  border:1px solid #2d3b55;
  border-radius:6px;
  background:#101a30;
  color:white;
  cursor:pointer;
  font-size:11px;
}

.column-controls button:hover{
  background:#243552;
}

.add-column-btn{
  margin-top:12px;
  padding:10px 14px;
  border:0;
  border-radius:9px;
  background:#ffb718;
  color:#101a30;
  font-weight:800;
  cursor:pointer;
}

.save-summary-btn{
  margin-top:10px;
  padding:11px 16px;
  border:0;
  border-radius:9px;
  background:#65e572;
  color:#101a30;
  font-weight:900;
  cursor:pointer;
}

.summary-date-input{
  width:80px;
  padding:10px;
  border-radius:8px;
  border:1px solid #2d3b55;
  background:#101a30;
  color:white;
  margin-bottom:12px;
}
</style>
</head>

<body>

<header class="top">
  <div>
    <h1>MK TIME</h1>
    <p>Admin Dashboard</p>
  </div>

  <a class="admin-link" href="index.html">
    Public Site
  </a>
</header>

<main>

<section id="loginBox" class="section">

  <div class="section-title">
    <span>ADMIN LOGIN</span>
  </div>

  <form id="loginForm" class="form">

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

    <p id="loginMsg"></p>

  </form>

</section>

<section id="dashboard" hidden>

<section class="section">

  <div class="section-title">
    <span>✏️ EDIT RESULT TABLE</span>
  </div>

  <div class="result-editor">

    <label>DATE</label>
    <br>

    <input
      id="summaryDate"
      class="summary-date-input"
      type="number"
      min="1"
      max="31"
      placeholder="29"
    >

    <div class="summary-scroll">

      <table class="summary-editor-table">

        <thead>
          <tr id="summaryHeader"></tr>
        </thead>

        <tbody>
          <tr id="summaryInputs"></tr>
        </tbody>

      </table>

    </div>

    <button
      type="button"
      class="add-column-btn"
      id="addColumnBtn"
    >
      ➕ Add Column
    </button>

    <br>

    <button
      type="button"
      class="save-summary-btn"
      id="saveSummaryBtn"
    >
      💾 SAVE RESULT TABLE
    </button>

  </div>

</section>

<section class="notes">

  <h2>Manage Announcements</h2>

  <p>
    Changes are stored in Firebase and appear on the public site.
  </p>

</section>

<section class="section">

  <div class="section-title">
    <span>ADD / EDIT BOX</span>
  </div>

  <form id="boxForm" class="form">

    <input
      type="hidden"
      id="editId"
    >

    <input
      id="name"
      placeholder="Name / announcement"
      required
    >

    <input
      id="time"
      type="time"
      required
    >

    <input
      id="value"
      placeholder="Result / status text"
      required
    >

    <select id="section">

      <option value="live">LIVE</option>
      <option value="next">NEXT</option>

    </select>

    <button
      type="submit"
      id="saveBtn"
    >
      Add Box
    </button>

    <button
      type="button"
      id="cancelBtn"
      class="secondary"
      hidden
    >
      Cancel Edit
    </button>

  </form>

</section>

<section class="section">

  <div class="section-title">
    <span>LIVE BOXES</span>
  </div>

  <div
    id="liveAdmin"
    class="cards"
  ></div>

</section>

<section class="section">

  <div class="section-title">
    <span>NEXT BOXES</span>
  </div>

  <div
    id="nextAdmin"
    class="cards"
  ></div>

</section>

<section class="section">

  <div class="section-title">
    <span>PREVIOUS RECORDS</span>
  </div>

  <form id="recordForm" class="form">

    <input
      type="hidden"
      id="recordEditIndex"
    >

    <input
      id="recordMonth"
      type="text"
      placeholder="Month"
      required
    >

    <input
      id="recordDate"
      type="date"
      required
    >

    <input
      id="recordStatus"
      type="text"
      placeholder="Status"
      required
    >

    <input
      id="recordValue"
      type="text"
      placeholder="Result / Value"
      required
    >

    <button type="submit">
      Add Record
    </button>

  </form>

  <div
    id="adminRecords"
    class="records"
  ></div>

  <p id="recordMsg"></p>

</section>

<section class="section">

  <div class="section-title">
    <span>CHANGE PASSWORD</span>
  </div>

  <form id="pwForm" class="form">

    <input
      id="newPassword"
      type="password"
      minlength="6"
      placeholder="New password"
      required
    >

    <button type="submit">
      Change Password
    </button>

    <p id="pwMsg"></p>

  </form>

</section>

<button
  id="logout"
  class="secondary"
>
  Logout
</button>

</section>

</main>

<script type="module">

import {
  auth,
  db,
  doc,
  getDoc,
  siteRef,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut,
  updatePassword,
  onSnapshot,
  setDoc
} from "./firebase.js";

let data = {
  live: [],
  next: [],
  records: {}
};

let summaryColumns = [
  "SM",
  "DB",
  "SG",
  "FB",
  "GB",
  "GL",
  "DS"
];

const $ =
  id => document.getElementById(id);

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}

function to24(time){

  const m =
    String(time).match(
      /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
    );

  if(!m) return "";

  let hour =
    Number(m[1]);

  const minute =
    m[2];

  const ampm =
    m[3].toUpperCase();

  if(ampm === "PM" && hour < 12)
    hour += 12;

  if(ampm === "AM" && hour === 12)
    hour = 0;

  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute
  );

}

function to12(time){

  if(!time) return "";

  const parts =
    time.split(":");

  let hour =
    Number(parts[0]);

  const minute =
    parts[1];

  const ampm =
    hour >= 12
      ? "PM"
      : "AM";

  hour =
    hour % 12 || 12;

  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute +
    " " +
    ampm
  );

}

function renderSummaryEditor(){

  const header =
    $("summaryHeader");

  const inputs =
    $("summaryInputs");

  if(!header || !inputs)
    return;

  header.innerHTML =
    summaryColumns.map(
      (column,index) => `

        <th>

          <div class="column-controls">

            <button
              type="button"
              onclick="moveColumn(${index},-1)"
              ${index === 0 ? "disabled" : ""}
            >
              ◀️
            </button>

            <button
              type="button"
              onclick="moveColumn(${index},1)"
              ${index === summaryColumns.length-1 ? "disabled" : ""}
            >
              ▶️
            </button>

            <button
              type="button"
              onclick="deleteColumn(${index})"
            >
              ✕
            </button>

          </div>

          <input
            type="text"
            value="${esc(column)}"
            data-column-index="${index}"
            class="column-name-input"
          >

        </th>

      `
    )
    .join("");

  inputs.innerHTML =
    summaryColumns.map(
      (column,index) => `

        <td>

          <input
            type="text"
            id="summaryValue_${index}"
            placeholder="${esc(column)}"
          >

        </td>

      `
    )
    .join("");

}

function readColumnNames(){

  const fields =
    document.querySelectorAll(
      ".column-name-input"
    );

  fields.forEach(
    (field,index) => {

      const value =
        field.value.trim();

      if(value){
        summaryColumns[index] =
          value;
      }

    }
  );

}

window.moveColumn =
function(index,direction){

  readColumnNames();

  const newIndex =
    index + direction;

  if(
    newIndex < 0 ||
    newIndex >= summaryColumns.length
  ){
    return;
  }

  const temp =
    summaryColumns[index];

  summaryColumns[index] =
    summaryColumns[newIndex];

  summaryColumns[newIndex] =
    temp;

  renderSummaryEditor();

};

window.deleteColumn =
function(index){

  readColumnNames();

  if(summaryColumns.length <= 1){

    alert(
      "Kam se kam 1 column rehna chahiye."
    );

    return;

  }

  const name =
    summaryColumns[index];

  const ok =
    confirm(
      "Column '" +
      name +
      "' delete karna hai?"
    );

  if(!ok)
    return;

  summaryColumns.splice(
    index,
    1
  );

  renderSummaryEditor();

};

$("addColumnBtn").onclick =
function(){

  readColumnNames();

  const name =
    prompt(
      "New column ka naam daalo:",
      "NEW"
    );

  if(!name)
    return;

  const clean =
    name.trim();

  if(!clean)
    return;

  summaryColumns.push(
    clean
  );

  renderSummaryEditor();

};

renderSummaryEditor();

  /* =====================================================
   SAVE RESULT SUMMARY
===================================================== */

$("saveSummaryBtn").onclick =
async function(){

  const user =
    auth.currentUser;

  if(!user){

    alert(
      "Pehle Admin login karo."
    );

    return;

  }

  readColumnNames();

  const date =
    $("summaryDate")
      .value
      .trim();

  const day =
    Number(date);

  if(
    !Number.isInteger(day) ||
    day < 1 ||
    day > 31
  ){

    alert(
      "Date 1 se 31 ke beech daalo."
    );

    return;

  }

  const values = {};

  summaryColumns.forEach(
    (column,index) => {

      const input =
        $("summaryValue_" + index);

      values[column] =
        input
          ? input.value.trim()
          : "";

    }
  );

  const resultRef =
    doc(
      db,
      "resultSummary",
      "current"
    );

  const btn =
    $("saveSummaryBtn");

  btn.disabled =
    true;

  btn.textContent =
    "Saving...";

  try{

    const snap =
      await getDoc(
        resultRef
      );

    const oldData =
      snap.exists()
        ? snap.data()
        : {};

    const records =
      oldData.records || {};

    records[String(day)] =
      values;

    const month =
      oldData.month ||
      new Date().toLocaleString(
        "en-US",
        {
          month:"long",
          year:"numeric"
        }
      );

    await setDoc(
      resultRef,
      {
        month:month,
        records:records,
        columns:summaryColumns,
        updatedAt:
          new Date().toISOString()
      },
      {
        merge:true
      }
    );

    alert(
      "RESULT " +
      day +
      " SAVE HO GAYA ✅"
    );

    summaryColumns.forEach(
      (column,index) => {

        const input =
          $("summaryValue_" + index);

        if(input)
          input.value = "";

      }
    );

    $("summaryDate").value =
      "";

  }

  catch(error){

    console.error(error);

    alert(
      "Result save nahi hua ❌"
    );

  }

  finally{

    btn.disabled =
      false;

    btn.textContent =
      "💾 SAVE RESULT TABLE";

  }

};


/* =====================================================
   RENDER BOXES
===================================================== */

function render(){

  ["live","next"].forEach(
    section => {

      const container =
        $(section + "Admin");

      if(!container)
        return;

      const boxes =
        data[section] || [];

      if(!boxes.length){

        container.innerHTML =
          '<p class="empty">No boxes.</p>';

        return;

      }

      container.innerHTML =
        boxes.map(
          box => `

            <article class="card admin-card">

              <div>

                <small>
                  ${esc(box.time)}
                </small>

                <h3>
                  ${esc(box.name)}
                </h3>

                <p>
                  ${esc(box.value)}
                  ${
                    box.locked
                      ? " • LOCKED"
                      : ""
                  }
                </p>

              </div>

              <div class="actions">

                <button
                  onclick="editBox('${esc(box.id)}','${section}')"
                >
                  Edit
                </button>

                <button
                  onclick="toggleLock('${esc(box.id)}','${section}')"
                >
                  ${
                    box.locked
                      ? "Unlock"
                      : "Lock"
                  }
                </button>

                <button
                  onclick="deleteBox('${esc(box.id)}','${section}')"
                  class="danger"
                >
                  Delete
                </button>

              </div>

            </article>

          `
        )
        .join("");

    }
  );

}


/* =====================================================
   SAVE DATA
===================================================== */

async function saveData(){

  await setDoc(
    siteRef,
    data
  );

  render();

}


/* =====================================================
   EDIT BOX
===================================================== */

window.editBox =
function(id,section){

  const box =
    (data[section] || [])
      .find(
        item =>
          item.id === id
      );

  if(!box)
    return;

  $("editId").value =
    box.id;

  $("name").value =
    box.name;

  $("time").value =
    to24(box.time);

  $("value").value =
    box.value;

  $("section").value =
    section;

  $("saveBtn").textContent =
    "Save Changes";

  $("cancelBtn").hidden =
    false;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =====================================================
   LOCK
===================================================== */

window.toggleLock =
async function(id,section){

  const box =
    (data[section] || [])
      .find(
        item =>
          item.id === id
      );

  if(!box)
    return;

  box.locked =
    !box.locked;

  await saveData();

};


/* =====================================================
   DELETE BOX
===================================================== */

window.deleteBox =
async function(id,section){

  if(
    !confirm(
      "Delete this box?"
    )
  ){
    return;
  }

  data[section] =
    (data[section] || [])
      .filter(
        box =>
          box.id !== id
      );

  await saveData();

};


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

  $("editId").value =
    "";

  $("name").value =
    "";

  $("time").value =
    "";

  $("value").value =
    "";

  $("section").value =
    "live";

  $("saveBtn").textContent =
    "Add Box";

  $("cancelBtn").hidden =
    true;

}


/* =====================================================
   ADD / EDIT BOX
===================================================== */

$("boxForm").onsubmit =
async function(event){

  event.preventDefault();

  const editId =
    $("editId").value;

  const section =
    $("section").value;

  const box = {

    name:
      $("name").value.trim(),

    time:
      to12(
        $("time").value
      ),

    value:
      $("value").value.trim(),

    locked:false

  };

  if(editId){

    let oldBox =
      null;

    for(
      const sec of
      ["live","next"]
    ){

      const index =
        (data[sec] || [])
          .findIndex(
            item =>
              item.id === editId
          );

      if(index !== -1){

        oldBox =
          data[sec][index];

        data[sec].splice(
          index,
          1
        );

        break;

      }

    }

    box.id =
      editId;

    box.locked =
      oldBox
        ? !!oldBox.locked
        : false;

  }

  else{

    box.id =
      crypto.randomUUID();

  }

  if(
    !Array.isArray(
      data[section]
    )
  ){

    data[section] = [];

  }

  data[section].push(
    box
  );

  try{

    await saveData();

    resetForm();

  }

  catch(error){

    console.error(error);

    alert(
      "Box save nahi hua."
    );

  }

};


/* =====================================================
   CANCEL EDIT
===================================================== */

$("cancelBtn").onclick =
function(){

  resetForm();

};


/* =====================================================
   LOGIN
===================================================== */

$("loginForm").onsubmit =
async function(event){

  event.preventDefault();

  $("loginMsg").textContent =
    "Logging in...";

  try{

    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );

    $("loginMsg").textContent =
      "";

  }

  catch(error){

    console.error(error);

    $("loginMsg").textContent =
      "Login failed: " +
      error.message;

  }

};


/* =====================================================
   LOGOUT
===================================================== */

$("logout").onclick =
async function(){

  try{

    await signOut(auth);

  }

  catch(error){

    console.error(error);

  }

};


/* =====================================================
   CHANGE PASSWORD
===================================================== */

$("pwForm").onsubmit =
async function(event){

  event.preventDefault();

  const user =
    auth.currentUser;

  if(!user){

    $("pwMsg").textContent =
      "Please login first.";

    return;

  }

  const newPassword =
    $("newPassword").value;

  try{

    await updatePassword(
      user,
      newPassword
    );

    $("pwMsg").textContent =
      "Password changed successfully.";

    $("newPassword").value =
      "";

  }

  catch(error){

    console.error(error);

    $("pwMsg").textContent =
      "Password change failed. Log in again if required.";

  }

};


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  function(user){

    $("loginBox").hidden =
      !!user;

    $("dashboard").hidden =
      !user;

    if(user){

      onSnapshot(
        siteRef,

        function(snapshot){

          if(snapshot.exists()){

            data = {

              live:[],
              next:[],
              records:{},

              ...snapshot.data()

            };

          }

          else{

            data = {

              live:[],
              next:[],
              records:{}

            };

          }

          render();

        },

        function(error){

          console.error(
            "Firebase error:",
            error
          );

        }
      );

    }

  }
);
  /* ================= INITIAL RENDER ================= */

renderSummaryEditor();
render();

/* ================= END ================= */

</script>

</body>

  </html>
